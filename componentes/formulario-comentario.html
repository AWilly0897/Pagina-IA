<section class="formulario-testimonial" aria-labelledby="titulo-formulario">
  <h2 id="titulo-formulario">Tu pensamiento sobre este artículo</h2>
  <form id="formulario-comentario" aria-label="Formulario de comentario" autocomplete="on">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" autocomplete="name" />

    <label for="comentario">Comentario</label>
    <textarea id="comentario" name="comentario" rows="4" aria-required="true"></textarea>

    <button type="submit">Enviar comentario</button>
  </form>
</section>
